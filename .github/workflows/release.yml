# Build an installable APK and publish a GitHub Release when a signed tag is pushed.
# Unsigned / lightweight tags fail closed (no release).
name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify tag · build APK · publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for tag verification)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import tag-signing public keys
        env:
          TAG_SIGNING_PUBLIC_KEY: ${{ secrets.TAG_SIGNING_PUBLIC_KEY }}
          TAG_SIGNING_ALLOWED_SIGNERS: ${{ secrets.TAG_SIGNING_ALLOWED_SIGNERS }}
        run: |
          set -euo pipefail
          if [ -n "${TAG_SIGNING_PUBLIC_KEY:-}" ]; then
            echo "$TAG_SIGNING_PUBLIC_KEY" | gpg --batch --import
            echo "Imported GPG public key(s) for tag verification"
          else
            echo "No TAG_SIGNING_PUBLIC_KEY secret — git verify-tag may fail for GPG-signed tags"
          fi
          if [ -n "${TAG_SIGNING_ALLOWED_SIGNERS:-}" ]; then
            mkdir -p "$HOME/.config/git"
            printf '%s\n' "$TAG_SIGNING_ALLOWED_SIGNERS" > "$HOME/.config/git/allowed_signers"
            git config --global gpg.ssh.allowedSignersFile "$HOME/.config/git/allowed_signers"
            echo "Configured SSH allowed_signers for tag verification"
          else
            echo "No TAG_SIGNING_ALLOWED_SIGNERS secret — SSH-signed tags may not verify"
          fi

      - name: Verify tag is cryptographically signed
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "Verifying git tag: $TAG"

          # Resolve the tag object (must be annotated — signed tags always are)
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag refs/tags/$TAG not found after checkout"
            exit 1
          fi

          OBJ_TYPE="$(git cat-file -t "refs/tags/$TAG")"
          if [ "$OBJ_TYPE" != "tag" ]; then
            echo "::error::Tag $TAG is lightweight (type=$OBJ_TYPE). Create a signed annotated tag: git tag -s $TAG -m '…'"
            exit 1
          fi

          # Fail closed: unsigned annotated tags and unverifiable signatures both fail
          if ! git verify-tag "$TAG"; then
            echo "::error::Tag $TAG is not signed or signature could not be verified."
            echo "Use: git tag -s $TAG -m 'Release $TAG'   # GPG"
            echo "  or: git tag -s $TAG -m 'Release $TAG'   # SSH if gpg.format=ssh"
            echo "Configure secrets TAG_SIGNING_PUBLIC_KEY (GPG) and/or TAG_SIGNING_ALLOWED_SIGNERS (SSH)."
            exit 1
          fi
          echo "Tag signature verified for $TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Android release keystore (optional)
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            echo "path=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No RELEASE_KEYSTORE_BASE64 — release APK will be signed with the debug keystore (documented personal-release path)"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            export RELEASE_STORE_FILE="${RUNNER_TEMP}/release.keystore"
          fi
          ./gradlew :app:assembleRelease --stacktrace
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::No APK found under app/build/outputs/apk/release"
            find app/build/outputs -type f -name '*.apk' || true
            exit 1
          fi
          echo "Built APK: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          cp "$APK" "tasker-lite-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tasker Lite ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            tasker-lite-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
